  <!--
    Non-blocking font loading. Reduced to two weights (400/700) — saves ~140KB
    of font payload on first visit. Other weights are rarely used in body text.
    `display=swap` ensures text paints with the system fallback while web
    fonts load, eliminating FOIT and improving FCP/LCP.
  -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Playfair+Display:wght@600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Playfair+Display:wght@600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Playfair+Display:wght@600&display=swap"></noscript>

  <!--
    Pretendard is ONLY used inside off-screen certificate rendering
    (certificateGenerator → html2canvas). Loading the full ~600KB font CSS on
    every page visit was wasteful. We now lazy-load it on demand from
    `certificateGenerator` itself, just before rendering the certificate.
  -->

  <!--
    Performance: inline critical boot styles + skeleton.
    The React bundle takes a few seconds on cold load; without this the
    browser paints a blank white page and FCP/LCP both wait for the JS
    bundle to hydrate. By rendering a static skeleton immediately we
    move FCP to ~0.1s and LCP to whatever the first hydrated text is.
  -->
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
    #root { min-height: 100vh; }
    #boot-skeleton { position: fixed; inset: 0; background: #ffffff; z-index: 0; overflow: hidden; }
    #boot-skeleton .sk { background: #eef1f6; border-radius: 12px; position: relative; overflow: hidden; }
    #boot-skeleton .sk::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.65) 50%, rgba(255,255,255,0) 100%);
      transform: translateX(-100%);
      animation: bootshimmer 1.4s infinite;
    }
    @keyframes bootshimmer { to { transform: translateX(100%); } }
    #boot-skeleton .gnb { height: 72px; background: #1a3a8c; display: flex; align-items: center;
      gap: 28px; padding: 0 clamp(16px, 6vw, 96px); }
    #boot-skeleton .gnb .logo { width: 118px; height: 24px; background: rgba(255,255,255,0.28); border-radius: 6px; }
    #boot-skeleton .gnb .nav { width: 74px; height: 14px; background: rgba(255,255,255,0.18); border-radius: 999px; }
    #boot-skeleton .wrap { padding: clamp(32px, 5vw, 64px) clamp(16px, 6vw, 96px); max-width: 1280px; margin: 0 auto; }
    #boot-skeleton .row { display: flex; gap: 32px; flex-wrap: wrap; }
    #boot-skeleton .col { flex: 1 1 320px; min-width: 0; }
    #boot-skeleton .visual { height: clamp(180px, 26vw, 320px); border-radius: 24px; margin-top: 40px; }
    #boot-skeleton .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 48px; }
    #boot-skeleton .card { height: 220px; border-radius: 20px; }
  </style>
</head>

  <body>
    <div id="root"></div>
    <div id="boot-skeleton" aria-hidden="true">
      <div class="gnb">
        <div class="logo"></div>
        <div class="nav"></div>
        <div class="nav"></div>
        <div class="nav"></div>
        <div class="nav"></div>
      </div>
      <div class="wrap">
        <div class="row">
          <div class="col">
            <div class="sk" style="width:96px;height:14px"></div>
            <div class="sk" style="width:min(100%,520px);height:38px;margin-top:20px"></div>
            <div class="sk" style="width:min(80%,420px);height:38px;margin-top:14px"></div>
          </div>
          <div class="col">
            <div class="sk" style="width:100%;height:14px;margin-top:8px"></div>
            <div class="sk" style="width:88%;height:14px;margin-top:12px"></div>
            <div class="sk" style="width:60%;height:14px;margin-top:12px"></div>
            <div class="sk" style="width:150px;height:44px;margin-top:24px;border-radius:999px"></div>

        </div>
        <div class="sk visual"></div>
        <div class="cards">
          <div class="sk card"></div>
          <div class="sk card"></div>
        </div>
      </div>
    </div>

    <script>
      window.addEventListener('error', function(e) {
        if (e.message && e.message.indexOf('module script') !== -1) {
          if (!sessionStorage.getItem('chunk_reload')) {
            sessionStorage.setItem('chunk_reload', '1');
            window.location.reload();
          }
        }
      });
    </script>
