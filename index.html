  <!-- Performance: DNS prefetch + preconnect for critical origins -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://qtwonnpncbrsdgbtjrjy.supabase.co">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://qtwonnpncbrsdgbtjrjy.supabase.co" crossorigin>

  <!--
    Non-blocking font loading. Reduced to two weights (400/700) — saves ~140KB
    of font payload on first visit. Other weights are rarely used in body text.
    `display=swap` ensures text paints with the system fallback while web
    fonts load, eliminating FOIT and improving FCP/LCP.
  -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Playfair+Display:wght@600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Playfair+Display:wght@600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Playfair+Display:wght@600&display=swap"></noscript>

  <!--
    Pretendard is ONLY used inside off-screen certificate rendering
    (certificateGenerator → html2canvas). Loading the full ~600KB font CSS on
    every page visit was wasteful. We now lazy-load it on demand from
    `certificateGenerator` itself, just before rendering the certificate.
  -->

  <!--
    Performance: inline critical boot styles + skeleton.
    The React bundle takes a few seconds on cold load; without this the
    browser paints a blank white page and FCP/LCP both wait for the JS
    bundle to hydrate. By rendering a static skeleton immediately we
    move FCP to ~0.1s and LCP to whatever the first hydrated text is.
  -->
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
    #root { min-height: 100vh; }
    #boot-skeleton { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; background: #ffffff; z-index: 0; }
    #boot-skeleton .brand {
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 28px; font-weight: 800; font-style: italic;
      letter-spacing: -0.01em; color: #1a1a2e;
      display: inline-flex;
    }
    #boot-skeleton .brand .ch {
      display: inline-block;
      opacity: 0;
      transform: translateY(8px);
      animation: bootbrand-in 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes bootbrand-in {
      0%   { opacity: 0; transform: translateY(8px); }
      25%  { opacity: 1; transform: translateY(0); }
      75%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-2px); }
    }
    #boot-skeleton .bar { width: 200px; height: 1.5px; background: #f0f0f0; border-radius: 999px;
      overflow: hidden; position: relative; }
    /* Toss-style indeterminate: two overlapping bars with smooth easing for an organic flow */
    #boot-skeleton .bar::before,
    #boot-skeleton .bar::after { content: ""; position: absolute; top: 0; bottom: 0;
      background: #1a1a1a; border-radius: 999px; will-change: left, right; }
    #boot-skeleton .bar::before {
      animation: bootbar-1 2.1s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
    }
    #boot-skeleton .bar::after {
      animation: bootbar-2 2.1s cubic-bezier(0.165, 0.84, 0.44, 1) 1.15s infinite;
    }
    @keyframes bootbar-1 {
      0%   { left: -35%; right: 100%; }
      60%  { left: 100%; right: -90%; }
      100% { left: 100%; right: -90%; }
    }
    @keyframes bootbar-2 {
      0%   { left: -200%; right: 100%; }
      60%  { left: 107%; right: -8%; }
      100% { left: 107%; right: -8%; }
    }
    /* Hidden once React mounts and removes #boot-skeleton */
  </style>
  <meta property="og:title" content="WEBHEADS —  이러닝플랫폼">
  <meta name="twitter:title" content="WEBHEADS —  이러닝플랫폼">
  <meta property="og:description" content="영상·HTML5 콘텐츠, 평가, 수료증, 다국어와 AI 기능까지 한 번에 제공하는 맞춤형 이러닝 플랫폼입니다.">
  <meta name="twitter:description" content="영상·HTML5 콘텐츠, 평가, 수료증, 다국어와 AI 기능까지 한 번에 제공하는 맞춤형 이러닝 플랫폼입니다.">
</head>

  <body>
    <div id="root"></div>
    <div id="boot-skeleton" aria-hidden="true">
      <div class="brand" aria-label="WEBHEADS">
        <span class="ch" style="animation-delay:0.00s">W</span><span class="ch" style="animation-delay:0.08s">E</span><span class="ch" style="animation-delay:0.16s">B</span><span class="ch" style="animation-delay:0.24s">H</span><span class="ch" style="animation-delay:0.32s">E</span><span class="ch" style="animation-delay:0.40s">A</span><span class="ch" style="animation-delay:0.48s">D</span><span class="ch" style="animation-delay:0.56s">S</span><span class="ch" style="animation-delay:0.64s">.</span>
      </div>
      <div class="bar"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && e.message.indexOf('module script') !== -1) {
          if (!sessionStorage.getItem('chunk_reload')) {
            sessionStorage.setItem('chunk_reload', '1');
            window.location.reload();
          }
        }
      });
    </script>
  </body>
